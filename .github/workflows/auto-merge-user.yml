name: Auto-Merge Specific User
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # REPLACE 'target-username' with the actual GitHub username
    if: github.event.pull_request.user.login == 'exercism-solutions-syncer'
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
